# NOTE: to be able to run CI define the following env variables:
# --DOCKER_IMAGE_PATH - the path to docker image


image: ${DOCKER_IMAGE_PATH}

variables:
  GIT_SUBMODULE_STRATEGY: normal

before_script:
  - export PATH=/opt/lm32-gcc/bin:$PATH

stages:
- compile

make_wrpc_sw:
  stage: compile
#  tags:
#    - wrs_sw
  script:
  - make spec_defconfig
  - make
  artifacts:
    name: wrpc_sw_ci_${CI_JOB_NAME}_${CI_JOB_ID}
    paths:
    - wrc.bin
    - wrc.elf
    - wrc.bram
    - wrc.mif

make_all:
  stage: compile
#  tags:
#    - wrs_sw
  script:
    - echo "Using `grep -c ^processor /proc/cpuinfo` parallel jobs".
    - MAKEFLAGS="-j `grep -c ^processor /proc/cpuinfo`" ./MAKEALL -c
  artifacts:
    name: wrpc_sw_ci_${CI_JOB_NAME}_${CI_JOB_ID}
    paths:
    - size_info.txt
    - ./*.elf
    - ./*.bin


make_rt_cpu:
  stage: compile
#  tags:
#    - wrs_sw
  script:
  - make wr_switch_defconfig
  - make
  artifacts:
    name: wrpc_sw_ci_${CI_JOB_NAME}_${CI_JOB_ID}
    paths:
    - rt_cpu.elf
